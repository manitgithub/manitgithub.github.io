<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>มานิต (Manit) — Full-Stack Developer & System Analyst</title>
<meta name="description" content="มานิต — Full-Stack Developer และเจ้าหน้าที่วิเคราะห์ระบบ มหาวิทยาลัยวลัยลักษณ์ ประสบการณ์กว่า 10 ปี พัฒนาระบบสารสนเทศมาแล้ว 50+ ระบบ">
<meta name="theme-color" content="#05070d">
<meta property="og:type" content="profile">
<meta property="og:url" content="https://manitgithub.github.io/">
<meta property="og:title" content="มานิต (Manit) — Full-Stack Developer & System Analyst">
<meta property="og:description" content="ประสบการณ์พัฒนาระบบสารสนเทศกว่า 10 ปี · 50+ ระบบ · มหาวิทยาลัยวลัยลักษณ์">
<meta property="og:image" content="https://github.com/manitgithub.png?size=600">
<link rel="icon" href="https://github.com/manitgithub.png?size=64">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Oxanium:wght@600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<a class="skip" href="#cards">ข้ามไปยังเนื้อหา</a>

<main class="stage" id="stage">
  <!-- background: drop in assets/img/office-bg.webp; the CSS scene below is shown until that file exists -->
  <div class="bg" id="bg" aria-hidden="true">
    <div class="bg-fallback">
      <i class="lamp l1"></i><i class="lamp l2"></i><i class="lamp l3"></i><i class="lamp l4"></i>
      <i class="win w1"></i><i class="win w2"></i><i class="win w3"></i>
      <i class="desk"></i>
      <i class="mon m1"></i><i class="mon m2"></i><i class="mon m3"></i><i class="mon m4"></i>
      <i class="bokeh b1"></i><i class="bokeh b2"></i><i class="bokeh b3"></i><i class="bokeh b4"></i><i class="bokeh b5"></i>
    </div>
  </div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="spot" id="spot" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="./" aria-label="Manit">M</a>
    <p class="avail"><i aria-hidden="true"></i><span data-t="available"></span></p>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="th">ไทย</button><button data-lang="en">EN</button>
    </div>
  </header>

  <nav class="cards" id="cards" aria-label="Sections"></nav>

  <!-- person: drop in assets/img/manit-seated.webp (transparent background); the avatar orb is shown until then -->
  <div class="person" id="person" aria-hidden="true">
    <img id="personImg" alt="" src="assets/img/manit-seated.webp">
    <div class="person-fallback">
      <div class="halo"></div>
      <img src="https://github.com/manitgithub.png?size=520" alt="" onerror="this.style.display='none'">
      <span class="ini">ม</span>
      <span class="tag">&lt;dev /&gt;</span>
    </div>
  </div>

  <div class="headline">
    <h1><small data-t="hello"></small><strong data-t="name"></strong></h1>
    <span class="role" data-t="role"></span>
    <em data-t="hint"></em>
  </div>
  <p class="foot">© <span id="year"></span> Manit · <span data-t="footer"></span> · <kbd>1–6</kbd> / <kbd>Esc</kbd></p>
</main>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="backdrop" data-close></div>
  <section class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle">
    <button class="close" data-close aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="panel-inner" id="panelInner"></div>
  </section>
</div>

<script src="qrcode.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
